# Airflow local dev stack for the Music Recommendation System
#
# Usage:
#   cd airflow
#   echo "AIRFLOW_UID=$(id -u)" > .env       # Linux/Mac only — skip on Windows
#   docker compose up -d
#   Open http://localhost:8080  (user: admin  /  password: admin)
#
# The project root is mounted at /opt/airflow/project inside all containers,
# so the DAG can call train.py and read data/music_rec.db directly.

version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2-python3.11
  environment:
    # Core
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: 'ofkCXnqW_hzZ98Ftxd72hpwTwCDNQLVvPdb5PTNOuWk='

    # Metadata DB
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    # API auth (simple for local dev)
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'

    # Project path (used in the DAG)
    MUSIC_REC_ROOT: /opt/airflow/project

    # Music API credentials — set real values in airflow/.env
    LASTFM_API_KEY: ${LASTFM_API_KEY}
    SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
    SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}

    # Install project dependencies at container startup.
    # For a production image, build a custom Dockerfile instead.
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      scikit-learn>=1.3
      numpy>=1.24
      pandas>=2.0
      scipy>=1.11
      loguru>=0.7
      implicit>=0.7
      requests>=2.31

  volumes:
    - ./dags:/opt/airflow/dags            # DAG files
    - ./logs:/opt/airflow/logs            # Task logs
    - ./plugins:/opt/airflow/plugins      # Custom operators (empty for now)
    - ..:/opt/airflow/project             # Full project root

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres:
      condition: service_healthy

# ── Services ───────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@music-rec.local \
          --password admin
        echo "Airflow initialised. Open http://localhost:8080"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

# ── Volumes ────────────────────────────────────────────────────────────────────

volumes:
  postgres-db-volume:
